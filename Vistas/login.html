<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - EduWeb</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="form-wrapper">
        <div class="form-card">
            <h2>Iniciar Sesión</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="ejemplo@correo.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Ingresar</button>
            </form>
            <div class="switch-route">
                ¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>
            </div>
            <a href="index.html" class="back-home">← Volver al inicio</a>
        </div>
    </div>
</body>
</html>

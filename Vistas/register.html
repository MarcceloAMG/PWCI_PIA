<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - EduWeb</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Barra de Navegación Dummy -->
    <div class="dummy-nav-bar">
        <strong>🛠️ Navegación de Prueba:</strong>
        <span>[Pública]:</span> <a href="index.html">Inicio</a> | <a href="login.html">Login</a> | <a href="register.html">Registro</a> | <a href="curso-detalle.html">Detalle Curso</a> 
        <span style="margin-left:15px;">[Estudiante]:</span> <a href="estudiante-kardex.html">Mi Kardex</a> | <a href="estudiante-curso-fase.html">Ver Clases</a> | <a href="perfil-editar.html">Editar Perfil</a>
    </div>

    <div class="form-wrapper">
        <div class="form-card">
            <h2>Crear Cuenta</h2>
            <!-- Agregado id="registerForm" para vinculación con JS -->
            <form id="registerForm" action="#" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="fullname">Nombre Completo</label>
                    <input type="text" id="fullname" placeholder="Juan Pérez">
                </div>
                <div class="form-group">
                    <label for="gender">Género</label>
                    <select id="gender">
                        <option value="">Selecciona...</option>
                        <option value="M">Masculino</option>
                        <option value="F">Femenino</option>
                        <option value="O">Otro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="birthdate">Fecha de Nacimiento</label>
                    <input type="date" id="birthdate">
                </div>
                <div class="form-group">
                    <label for="avatar">Foto de perfil (Avatar)</label>
                    <input type="file" id="avatar" accept="image/*">
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="text" id="email" placeholder="juan@ejemplo.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Mínimo 8 caracteres">
                </div>
                <button type="submit" class="btn-submit accent">Registrarme</button>
            </form>
            <div class="switch-route">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
            </div>
            <a href="index.html" class="back-home">← Volver al inicio</a>
        </div>
    </div>

    <!-- Vinculación del Script JS Obligatorio antes del cierre del body -->
    <script src="validaciones.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calificar Curso - EduWeb</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h2><a href="estudiante-kardex.html">← Cancelar</a></h2>
    </header>

    <div class="form-wrapper">
        <div class="form-card" style="max-width: 550px;">
            <h2>Calificar Curso Finalizado</h2>
            <p style="font-size: 0.9rem; color: #64748b; text-align: center; margin-bottom: 1.5rem;">
                Tu opinión ayuda a mantener la integridad y calidad del portal.
            </p>

            <form action="estudiante-kardex.html" method="POST">
                <!-- Sistema de Puntuación (5 Estrellas maquetado) -->
                <div class="form-group" style="text-align: center;">
                    <label style="font-weight: bold;">¿Qué puntuación le das al curso?</label>
                    <div class="star-rating">
                        <span class="active">★</span>
                        <span class="active">★</span>
                        <span class="active">★</span>
                        <span class="active">★</span>
                        <span>★</span>
                    </div>
                    <span style="font-size: 0.85rem; color: #64748b;">(Haz clic para asignar de 1 a 5 estrellas)</span>
                </div>

                <!-- Comentario escrito Obligatorio -->
                <div class="form-group">
                    <label for="review">Reseña Escrita</label>
                    <textarea id="review" required placeholder="Escribe tu comentario sobre los niveles, el contenido y la atención del instructor..." style="width:100%; height:120px; padding:0.75rem; border:1px solid #cbd5e1; border-radius:4px; font-size:1rem; resize:none;"></textarea>
                </div>

                <button type="submit" class="btn-submit accent">Publicar Reseña y Finalizar</button>
            </form>
        </div>
    </div>
</body>
</html>
